name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore TrailHub.slnx
      - run: dotnet build TrailHub.slnx --no-restore -c Release -warnaserror
      - run: dotnet test TrailHub.slnx --no-build -c Release --logger "console;verbosity=normal"

  mobile:
    name: Mobile type-check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Expo writes this on `expo start`; it's gitignored, so create it for the type-check.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 0

  e2e:
    name: End-to-end (Docker stack)
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 40
    env:
      # Routing and points of interest need a Mapbox token; without the secret the route checks are skipped.
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile packages (the SignalR checks use its client)
        run: npm ci --ignore-scripts
        working-directory: mobile
      - name: Configure the stack for development auth
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^AUTH_MODE=.*/AUTH_MODE=Development/' .env
          echo "MODERATOR_USER_ID=moderation-mod" >> .env
          echo "MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}" >> .env
      - name: Start the stack
        working-directory: backend
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Wait for the gateway and services
        working-directory: backend
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/api/trails -H 'Authorization: Dev ci' >/dev/null && exit 0
            sleep 2
          done
          docker compose ps; docker compose logs --tail 50; exit 1
      - name: Smoke test
        working-directory: backend
        run: ./scripts/smoke-test.sh
      - name: SignalR live location
        working-directory: backend
        run: node scripts/signalr-test.mjs
      - name: Group trips
        working-directory: backend
        run: node scripts/group-trips-test.mjs
      - name: Route sharing and publishing
        if: env.MAPBOX_ACCESS_TOKEN != ''
        working-directory: backend
        run: node scripts/route-sharing-test.mjs
      - name: Moderation
        if: env.MAPBOX_ACCESS_TOKEN != ''
        working-directory: backend
        run: MODERATOR=moderation-mod node scripts/moderation-test.mjs
      - name: Service logs on failure
        if: failure()
        working-directory: backend
        run: docker compose logs --tail 200
