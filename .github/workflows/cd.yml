name: CD

# Publishes a container image per service to GitHub Container Registry after CI passes on main.
# Tags: the commit SHA and `latest`. Deploying them (Azure Container Apps, Fly.io, …) is the next step.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, project: src/Gateway/TrailHub.Gateway, dll: TrailHub.Gateway.dll }
          - { name: profile-api, project: src/Services/Profile/TrailHub.Profile.Api, dll: TrailHub.Profile.Api.dll }
          - { name: trails-api, project: src/Services/Trails/TrailHub.Trails.Api, dll: TrailHub.Trails.Api.dll }
          - { name: activity-api, project: src/Services/Activity/TrailHub.Activity.Api, dll: TrailHub.Activity.Api.dll }
          - { name: trips-api, project: src/Services/Trips/TrailHub.Trips.Api, dll: TrailHub.Trips.Api.dll }
          - { name: groups-api, project: src/Services/Groups/TrailHub.Groups.Api, dll: TrailHub.Groups.Api.dll }
          - { name: routes-api, project: src/Services/Routes/TrailHub.Routes.Api, dll: TrailHub.Routes.Api.dll }
          - { name: weather-api, project: src/Services/Weather/TrailHub.Weather.Api, dll: TrailHub.Weather.Api.dll }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase owner)
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trailhub-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            PROJECT=${{ matrix.project }}
            APP_DLL=${{ matrix.dll }}
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
